<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clappia Plant Suite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ffffff;--panel:#f7f9fc;--soft:#f2f5fa;--line:#e5eaf1;--line2:#eef2f7;
  --ink:#172636;--ink2:#40536a;--mute:#6f8196;--faint:#9aa9bb;
  --acc:#2196f3;--acc-d:#1479d1;--acc-s:#e9f4fe;
  --g:#1b9467;--g-s:#e5f6ee;--a:#b3761a;--a-s:#fdf2dc;--r:#cf4558;--r-s:#fdebee;--b:#2f7fd0;--b-s:#e9f2fc;
  --sh:0 1px 2px rgba(23,38,54,.05),0 6px 20px rgba(23,38,54,.06);
  --rad:12px;color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:26px;font-weight:700}h2{font-size:18px;font-weight:650}h3{font-size:15px;font-weight:650}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc-d);text-decoration:none}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font-weight:550;color:var(--ink2);white-space:nowrap;transition:.15s}
.btn:hover{border-color:#cfd8e3;background:var(--panel)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{background:var(--acc-d)}
.btn.soft{background:var(--acc-s);border-color:transparent;color:var(--acc-d)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.t-g{background:var(--g-s);color:var(--g)}.t-a{background:var(--a-s);color:var(--a)}.t-r{background:var(--r-s);color:var(--r)}.t-b{background:var(--b-s);color:var(--b)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--rad);box-shadow:0 1px 2px rgba(23,38,54,.03)}
.pad{padding:18px}
.mute{color:var(--mute)}.sm{font-size:12.5px}.lbl{font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.sp{flex:1}
.grid{display:grid;gap:14px}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.l-art{background:linear-gradient(160deg,#f3f8fe 0%,#eaf3fd 55%,#f6f3fd 100%);padding:44px max(16px,env(safe-area-inset-left,0px));padding-inline:44px;display:flex;flex-direction:column;gap:26px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#fff}
.l-art h1{font-size:clamp(28px,3.4vw,42px);line-height:1.12;max-width:14ch}
.l-art p{color:var(--ink2);max-width:46ch;font-size:15px;margin:0}
.l-list{display:grid;gap:10px;margin-top:auto}
.l-list div{display:flex;gap:10px;align-items:center;color:var(--ink2);font-weight:500}
.l-list i{width:22px;height:22px;border-radius:7px;background:#fff;display:grid;place-items:center;color:var(--acc);box-shadow:var(--sh);font-style:normal;font-size:12px}
.l-form{padding-block:36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center}
.l-in{width:100%;max-width:640px;display:flex;flex-direction:column;gap:18px;margin:auto 0}
.steps{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);font-weight:550}
.steps b{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--soft);font-size:12px}
.steps .on{color:var(--ink)}.steps .on b{background:var(--acc);color:#fff}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.role{text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;display:flex;gap:11px;align-items:center;transition:.15s}
.role:hover,.role.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-s)}
.role b{display:block;font-weight:650}.role span{font-size:12.5px;color:var(--mute)}
.role .av{color:#fff;font-size:12.5px}
.blogo{height:36px;width:auto;display:block}.bsub{font-weight:600;font-size:12.5px;color:var(--mute);border-left:1px solid var(--line);padding-left:10px;white-space:nowrap}
.cli{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line2)}.cli:first-child{border-top:0}
.cli .q{font-weight:550}.cli input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:100%}
.opt{display:inline-flex;gap:6px;flex-wrap:wrap}.opt label{cursor:pointer}.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:600;color:var(--ink2);background:#fff}
.opt input:checked+span.o{background:var(--g-s);border-color:var(--g);color:var(--g)}.opt input:checked+span.x{background:var(--r-s);border-color:var(--r);color:var(--r)}.opt input:checked+span.n{background:var(--soft);border-color:#b9c4d2;color:var(--ink)}
.opt input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.clc{display:grid;gap:10px;text-align:left}.newtag{background:var(--acc);color:#fff;border-radius:99px;font-size:10.5px;font-weight:700;padding:1px 7px;margin-left:6px;vertical-align:1px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-weight:550;font-size:13px;color:var(--ink2)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.cos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;max-height:290px;overflow:auto;padding:3px}
.co{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;text-align:left;font-weight:500}
.co.on{border-color:var(--acc);background:var(--acc-s);color:var(--acc-d);font-weight:650}

/* shell */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;padding:14px 10px 14px max(10px,env(safe-area-inset-left,0px))}
.side .brand{padding:6px 8px 14px}
.ws{margin:0 4px 10px;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid var(--line)}
.ws b{display:block;font-size:13px;line-height:1.3}.ws span{font-size:12px;color:var(--mute)}
.nl{padding:12px 10px 5px}
.ni{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 10px;border-radius:8px;color:var(--ink2);font-weight:520;text-align:left}
.ni:hover{background:#edf1f7}.ni.on{background:var(--acc-s);color:var(--acc-d);font-weight:650}
.ni .cv{margin-left:auto;transition:.15s;width:14px;height:14px;color:var(--faint)}.ni.open .cv{transform:rotate(90deg)}
.ni .n{margin-left:auto;background:var(--acc);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-weight:700}
.sub{display:grid;margin:2px 0 6px 19px;padding-left:10px;border-left:1px solid var(--line)}
.sub button{border:0;background:none;text-align:left;padding:5px 9px;border-radius:7px;color:var(--mute);font-size:13px}
.sub button:hover{color:var(--ink);background:#edf1f7}.sub button.on{color:var(--acc-d);font-weight:650;background:#fff;box-shadow:0 0 0 1px var(--line)}
.custom{margin:12px 4px 4px;border:1px dashed #b9cbe0;border-radius:11px;padding:12px;background:#fff;display:block;color:var(--ink)}
.custom b{display:flex;gap:7px;align-items:center;font-size:13px}.custom span{font-size:12px;color:var(--mute)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;height:58px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.crumb{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb span{color:var(--mute);font-weight:500}
.srch{position:relative;flex:1;max-width:360px;margin-left:auto}
.srch input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px 7px 34px;outline:0}
.srch input:focus{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px var(--acc-s)}
.srch .ic{position:absolute;left:10px;top:9px;color:var(--faint)}
.pop{position:absolute;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);z-index:40;overflow:hidden}
.srch .pop{left:0;right:0}.srch .pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px}.srch .pop button:hover{background:var(--panel)}
.ib{position:relative;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink2);flex:none}
.ib .dot{position:absolute;top:-4px;right:-4px;background:var(--r);color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:0 5px;border:2px solid #fff}
.npop{right:0;width:min(360px,calc(100vw - 32px))}
.nrow{display:flex;gap:10px;padding:11px 14px;border-top:1px solid var(--line2);cursor:pointer}.nrow:hover{background:var(--panel)}
.nrow.un{background:#f6faff}
.main{padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.in{max-width:1320px;margin:0 auto;display:grid;gap:18px;min-width:0}
.in>*{min-width:0}
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.ph p{margin:3px 0 0;color:var(--mute);max-width:70ch}
.mi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.mi .ic{width:22px;height:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px 16px}.kpi b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi small{font-size:12px;color:var(--mute)}.kpi small.up{color:var(--g)}.kpi small.dn{color:var(--r)}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;font-weight:650;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
td{padding:10px 14px;border-bottom:1px solid var(--line2);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
tbody tr{cursor:pointer}tbody tr:hover{background:#f8fbff}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.tb input,.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;outline:0;width:100%}
.tb input{width:210px}
.fld input:focus,.fld select:focus,.fld textarea:focus,.tb input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-s)}
.seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:4px 11px;border-radius:7px;font-size:13px;font-weight:550;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(23,38,54,.12)}
.bar{height:7px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.hb{display:grid;grid-template-columns:minmax(80px,34%) 1fr 34px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}.hb b{text-align:right;font-variant-numeric:tabular-nums}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
svg text{font-family:Inter,system-ui,sans-serif}

/* home */
.hero{border-radius:16px;padding:24px;background:linear-gradient(120deg,#f1f7fe,#f7f4fe 70%,#fef6f0);border:1px solid var(--line);display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.news{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.feat{overflow:hidden;display:flex;flex-direction:column}
.feat .art{height:170px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px}
.li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}.li:first-child{border-top:0;padding-top:0}
.dt{flex:none;width:44px;height:46px;border-radius:10px;background:var(--soft);display:grid;place-content:center;text-align:center;line-height:1.1}
.dt b{font-size:16px}.dt span{font-size:10px;text-transform:uppercase;color:var(--mute);font-weight:650}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}
.mod{text-align:left;padding:16px;border:1px solid var(--line);background:#fff;border-radius:14px;display:flex;flex-direction:column;gap:9px;transition:.18s;color:var(--ink)}
.mod:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:#d3dde9}
.mod p{margin:0;color:var(--mute);font-size:13px;flex:1}
.mod .ft{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);border-top:1px solid var(--line2);padding-top:9px}
.mod.dash{border-style:dashed;border-color:#b9cbe0;background:var(--panel)}

/* gantt */
.gw{overflow:auto;max-height:600px;border-top:1px solid var(--line)}
.gi{display:flex;width:max-content;min-width:100%}
.gl{position:sticky;left:0;z-index:3;background:#fff;border-right:1px solid var(--line);flex:none}
.gh{position:sticky;top:0;z-index:4;background:var(--panel);border-bottom:1px solid var(--line);height:44px;display:flex;align-items:center;font-size:11.5px;font-weight:650;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.gr{height:34px;display:flex;align-items:center;border-bottom:1px solid var(--line2);font-size:13px;cursor:pointer}
.gr:hover{background:#f8fbff}.gr.ph0{font-weight:650;background:#fbfcfe}
.gc{padding:0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.gt{position:relative}
.gt svg{display:block}
.heat td{text-align:center;padding:6px;border:2px solid #fff;border-radius:6px;font-size:12px;font-variant-numeric:tabular-nums}
.kb{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto}
.kc{background:var(--panel);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.kt{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;cursor:pointer}
.kt:hover{box-shadow:var(--sh)}
.gate{display:flex;gap:3px}.gate i{height:6px;flex:1;border-radius:3px;background:var(--soft)}.gate i.on{background:var(--acc)}
.rk{display:grid;grid-template-columns:auto repeat(5,1fr);gap:3px;font-size:11px}
.rk div{aspect-ratio:1.5;border-radius:5px;display:grid;place-items:center;font-weight:700}

/* collab */
.mail{display:grid;grid-template-columns:minmax(240px,360px) minmax(0,1fr);min-height:520px}
.ml{border-right:1px solid var(--line);overflow:auto;max-height:640px}
.mrow{padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer;display:grid;gap:2px}
.mrow:hover{background:var(--panel)}.mrow.on{background:var(--acc-s)}.mrow.un b{font-weight:700}.mrow b{font-weight:520}
.chat{display:grid;grid-template-columns:240px minmax(0,1fr);height:min(640px,calc(100vh - 150px))}
.cl{border-right:1px solid var(--line);overflow:auto;padding:8px}
.cm{display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:9px;max-width:78%}.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--soft);border-radius:12px;padding:8px 12px}.msg.me .bub{background:var(--acc);color:#fff}
.bub small{display:block;font-size:11px;opacity:.7}
.send{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.send input{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 12px;outline:0;min-width:0}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(23,38,54,.32);z-index:60;display:flex;justify-content:center;align-items:flex-start;padding:max(16px,5vh) 16px;overflow:auto}
.modal{background:#fff;border-radius:16px;width:min(560px,100%);box-shadow:0 20px 60px rgba(23,38,54,.25)}
.ov.dr{justify-content:flex-end;padding:0;align-items:stretch}
.ov.dr .modal{border-radius:0;width:min(460px,100%);overflow:auto}
.mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.mb{padding:18px;display:grid;gap:13px}
.mf{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.fld{display:grid;gap:4px}.fld label{font-size:12.5px;font-weight:600;color:var(--ink2)}.fld label i{color:var(--r);font-style:normal}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.err{color:var(--r);font-size:12px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px}.kv span{color:var(--mute)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:90;font-weight:550;box-shadow:var(--sh);max-width:calc(100vw - 32px)}
.cta{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 8px 24px rgba(33,150,243,.35);border-radius:99px;padding:10px 16px}
.burger{display:none}
@media(max-width:940px){
  .login{grid-template-columns:1fr}.l-art{padding:24px 16px;border-right:0;border-bottom:1px solid var(--line)}.l-list{display:none}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;z-index:50;left:0;top:0;width:280px;transform:translateX(-102%);transition:.2s;box-shadow:var(--sh)}
  .side.open{transform:none}
  .burger{display:grid}.news{grid-template-columns:1fr}
  .mail{grid-template-columns:1fr}.ml{border-right:0;max-height:260px;border-bottom:1px solid var(--line)}
  .chat{grid-template-columns:1fr;height:auto}.cl{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto}.cl .lbl{display:none}.cl .ni{width:auto;white-space:nowrap}.msgs{min-height:320px;max-height:420px}
  .srch{display:none}.crumb{flex:1}
  .hide-m{display:none!important}
}
</style>
</head><body>
<div id="app"></div><div id="ovr"></div><div id="toast"></div>

<script>
/* ============ helpers ============ */

const TODAY=new Date();TODAY.setHours(0,0,0,0);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dAt=o=>{const d=new Date(TODAY);d.setDate(d.getDate()+o);return d};
const fD=(o,y=1)=>{const d=dAt(o);return d.getDate()+' '+MON[d.getMonth()]+(y?' '+String(d.getFullYear()).slice(2):'')};
const rng=seed=>{let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
const tone=s=>{s=String(s);if(/overdue|fail|reject|critical|alarm|expired|breakdown|out of stock|below|major|high risk|not ready|blocked|shortage|absent|lapsed|delayed/i.test(s))return'r';if(/due|progress|pending|review|open|watch|expiring|low|awaiting|observ|partial|investigat|minor|draft|hold|reported|submitted|transit|risk/i.test(s))return'a';if(/complete|closed|approved|pass|compliant|valid|active|normal|in stock|verified|issued|ready|on target|released|implemented|done|present|capitalised|effective|received|logged|on track|cleared/i.test(s))return'g';return'b'};

const av=(n,sz=28)=>`<span class="av" style="width:${sz}px;height:${sz}px;background:${AVC[hash(n)%8]}">${esc(n.split(' ').map(w=>w[0]).slice(0,2).join(''))}</span>`;

function buildProjects(){

    const el=-st,T={};
    const tasks=TPL.map(([tid,tn,d,deps],i)=>{const dur=Math.round(d*sc);const bs=deps.length?Math.max(...deps.map(x=>T[x].bs+T[x].d)):0;
      const t={id:tid,n:tn,d:dur,deps,bs,ph:+tid[0],ms:d===0,owner:PEOPLE[(i+pi*3)%PEOPLE.length]};T[tid]=t;return t});
    const end=Math.max(...tasks.map(t=>t.bs+t.d));
    // backward pass for critical path
    [...tasks].reverse().forEach(t=>{const su=tasks.filter(x=>x.deps.includes(t.id));t.lf=su.length?Math.min(...su.map(x=>x.lf-x.d)):end;t.crit=t.lf-(t.bs+t.d)<=0});
    tasks.forEach(t=>{t.s=t.bs+(t.bs>el*.45?slip:0);const te=el-t.s;
      t.p=t.ms?(te>=0?100:0):Math.max(0,Math.min(100,Math.round(te/t.d*100*eff)));if(!t.ms&&te>=t.d&&eff>=.9)t.p=100});

const pPlan=p=>{const el=-p.st,w=p.tasks.filter(t=>!t.ms);return Math.round(w.reduce((a,t)=>a+Math.max(0,Math.min(1,(el-t.bs)/t.d))*t.d,0)/w.reduce((a,t)=>a+t.d,0)*100)};

function donut(items){const tot=items.reduce((a,i)=>a+i.v,0)||1;let acc=0;const R=52,C=2*Math.PI*R;
  return `<div class="row wrap" style="gap:18px"><svg width="130" height="130" viewBox="0 0 130 130" role="img" aria-label="Status split"><g transform="rotate(-90 65 65)">${items.map(i=>{const f=i.v/tot,s=`<circle cx="65" cy="65" r="${R}" fill="none" stroke="${i.c}" stroke-width="16" stroke-dasharray="${Math.max(0,f*C-2)} ${C}" stroke-dashoffset="${-acc*C}"/>`;acc+=f;return s}).join('')}</g><text x="65" y="62" text-anchor="middle" font-size="22" font-weight="700" fill="#172636">${tot}</text><text x="65" y="80" text-anchor="middle" font-size="11" fill="#6f8196">records</text></svg>
  <div style="display:grid;gap:6px;flex:1;min-width:140px">${items.map(i=>`<div class="row sm" style="gap:8px"><i style="width:9px;height:9px;border-radius:3px;background:${i.c}"></i><span style="flex:1;color:var(--ink2)">${esc(i.l)}</span><b>${i.v}</b></div>`).join('')}</div></div>`}
function hbars(items,c='#8dc4f8'){const mx=Math.max(...items.map(i=>i.v),1);return items.map(i=>`<div class="hb"><span title="${esc(i.l)}">${esc(i.l)}</span><div class="bar" style="height:9px"><i style="width:${i.v/mx*100}%;background:${i.c||c};border-radius:99px"></i></div><b>${i.v}</b></div>`).join('')}
function line(labels,series,o={}){const W=640,H=o.h||220,l=40,r=14,t=14,b=28,all=series.flatMap(s=>s.p.filter(v=>v!=null)).concat(o.limit||[]);
  let mx=Math.max(...all)*1.1,mn=o.min??Math.min(0,...all);if(mx===mn)mx=mn+1;
  const X=i=>l+i*(W-l-r)/(labels.length-1||1),Y=v=>t+(1-(v-mn)/(mx-mn))*(H-t-b);
  let g='';for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eef2f7"/><text x="${l-6}" y="${Y(v)+4}" font-size="10.5" fill="#9aa9bb" text-anchor="end">${v>=100?Math.round(v):+v.toFixed(1)}</text>`}
  const st=Math.ceil(labels.length/8);labels.forEach((x,i)=>{if(i%st===0)g+=`<text x="${X(i)}" y="${H-8}" font-size="10.5" fill="#9aa9bb" text-anchor="middle">${esc(x)}</text>`});
  if(o.limit)g+=`<line x1="${l}" x2="${W-r}" y1="${Y(o.limit)}" y2="${Y(o.limit)}" stroke="#e06a7a" stroke-dasharray="5 4"/><text x="${W-r}" y="${Y(o.limit)-5}" font-size="10.5" fill="#cf4558" text-anchor="end">${esc(o.ll||'Limit')} ${o.limit}</text>`;
  if(o.now!=null)g+=`<line x1="${X(o.now)}" x2="${X(o.now)}" y1="${t}" y2="${H-b}" stroke="#2196f3" stroke-dasharray="3 3"/><text x="${X(o.now)+4}" y="${t+9}" font-size="10" fill="#1479d1">Today</text>`;
  series.forEach(s=>{const pts=s.p.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);if(!pts.length)return;
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(s.area)g+=`<path d="${d} L${pts[pts.length-1][0]} ${H-b} L${pts[0][0]} ${H-b}Z" fill="${s.c}" opacity=".1"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.2" ${s.dash?'stroke-dasharray="6 5"':''} stroke-linejoin="round"/>`;
    if(!s.dash&&pts.length<16)g+=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="#fff" stroke="${s.c}" stroke-width="1.6"/>`).join('')});
  return `<div class="lg" style="margin-bottom:8px">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${esc(o.aria||'Trend chart')}">${g}</svg>`}
function cols(labels,series,o={}){const W=640,H=o.h||220,l=40,r=10,t=12,b=28,mx=Math.max(...series.flatMap(s=>s.p))*1.12||1,gw=(W-l-r)/labels.length,bw=Math.min(22,gw*.7/series.length);
  const Y=v=>t+(1-v/mx)*(H-t-b);let g='';for(let i=0;i<=4;i++){const v=mx*i/4;g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eef2f7"/><text x="${l-6}" y="${Y(v)+4}" font-size="10.5" fill="#9aa9bb" text-anchor="end">${v>=20?Math.round(v):+v.toFixed(1)}</text>`}
  labels.forEach((x,i)=>{const cx=l+gw*(i+.5);g+=`<text x="${cx}" y="${H-8}" font-size="10.5" fill="#9aa9bb" text-anchor="middle">${esc(String(x).slice(0,Math.max(6,Math.floor(gw/6))))}</text>`;
    series.forEach((s,j)=>{const x0=cx-(series.length*bw+(series.length-1)*3)/2+j*(bw+3);g+=`<rect x="${x0}" y="${Y(s.p[i])}" width="${bw}" height="${Math.max(0,H-b-Y(s.p[i]))}" rx="4" fill="${s.c}"><title>${esc(s.n)}: ${s.p[i]}</title></rect>`})});
  return `<div class="lg" style="margin-bottom:8px">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${esc(o.aria||'Bar chart')}">${g}</svg>`}
const ring=(p,c,sz=46)=>{const R=sz/2-5,C=2*Math.PI*R;return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${R}" fill="none" stroke="#eef2f7" stroke-width="5"/><circle cx="${sz/2}" cy="${sz/2}" r="${R}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${p/100*C} ${C}" transform="rotate(-90 ${sz/2} ${sz/2})"/><text x="${sz/2}" y="${sz/2+4}" text-anchor="middle" font-size="${sz/4}" font-weight="700" fill="#172636">${p}</text></svg>`};
const card=(title,body,extra='')=>`<div class="card pad"><div class="row" style="margin-bottom:12px"><h3>${title}</h3><span class="sp"></span>${extra}</div>${body}</div>`;
const groupBy=(rows,k)=>{const m={};rows.forEach(r=>m[r[k]]=(m[r[k]]||0)+1);return Object.entries(m).map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v)};

function gantt(p){
  const ppd={week:22,month:8,quarter:3.4}[UI.zoom],RH=34,HH=44,mob=window.innerWidth<700;
  const rows=[];PHN.forEach((n,i)=>{const ch=p.tasks.filter(t=>t.ph===i+1);const s=Math.min(...ch.map(t=>t.s)),e=Math.max(...ch.map(t=>t.s+t.d)),w=ch.filter(t=>!t.ms);
    rows.push({G:1,id:'PH'+(i+1),n,s,d:e-s,p:Math.round(w.reduce((a,t)=>a+t.p*t.d,0)/w.reduce((a,t)=>a+t.d,0))});if(!UI.col[p.id+i])ch.forEach(t=>rows.push(t))});
  const min=Math.min(0,...p.tasks.map(t=>Math.min(t.s,t.bs)))-7,max=Math.max(pEnd(p),pBEnd(p))+14,W=(max-min)*ppd,H=rows.length*RH;

  if(UI.zoom!=='quarter'){const s0=dAt(abs(min));s0.setDate(s0.getDate()-((s0.getDay()+6)%7));
    for(let w=new Date(s0);;w.setDate(w.getDate()+7)){const off=Math.round((w-TODAY)/864e5)-p.st;if(off>max)break;if(off<min)continue;const x=X(off);
      hd+=`<text x="${x+3}" y="35" font-size="10" fill="#9aa9bb">${w.getDate()}${UI.zoom==='week'?' '+MON[w.getMonth()]:''}</text>`;gr+=`<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="#f1f4f8"/>`}}
  let bars='',deps='';

    if(r.G){bars+=`<g data-act="colph" data-v="${r.id}" style="cursor:pointer"><rect x="${x}" y="${y+12}" width="${w}" height="8" rx="2" fill="#c3cedb"/><rect x="${x}" y="${y+12}" width="${w*r.p/100}" height="8" rx="2" fill="#40536a"/><path d="M${x} ${y+12}v13l5-5M${x+w} ${y+12}v13l-5-5" fill="#40536a"/><text x="${x+w+8}" y="${y+21}" font-size="11" font-weight="650" fill="#40536a">${r.p}%</text></g>`;return}
    const cr=UI.crit&&r.crit,c1=cr?'#f5b9c1':'#a9d3fa',c2=cr?'#e06a7a':'#2196f3';
    if(UI.base&&!r.ms)bars+=`<rect x="${X(r.bs)}" y="${y+25}" width="${Math.max(r.d*ppd,3)}" height="4" rx="2" fill="#c9d3df"/>`;
    if(r.ms){const mx=x,my=y+RH/2-2;bars+=`<g data-act="task" data-v="${r.id}" style="cursor:pointer"><path d="M${mx} ${my-8}l8 8-8 8-8-8z" fill="${r.p>=100?'#1b9467':cr?'#cf4558':'#172636'}"/><text x="${mx+13}" y="${my+4}" font-size="11.5" font-weight="600" fill="#172636">${esc(r.n)} · ${fD(abs(r.s),0)}</text></g>`}
    else bars+=`<g data-act="task" data-v="${r.id}" style="cursor:pointer"><rect x="${x}" y="${y+7}" width="${w}" height="16" rx="5" fill="${c1}"/><rect x="${x}" y="${y+7}" width="${w*r.p/100}" height="16" rx="5" fill="${c2}"/><text x="${x+w+7}" y="${y+19}" font-size="11" fill="#6f8196">${r.p}%${UI.zoom==='week'?' · '+esc(r.owner.split(' ')[0]):''}</text><title>${esc(r.n)}: ${fD(abs(r.s))} to ${fD(abs(r.s+r.d))}</title></g>`;
    if(UI.dep)r.deps.forEach(dp=>{if(yi[dp]==null)return;const a=p.tasks.find(t=>t.id===dp),x1=X(a.s+a.d)+(a.ms?8:0),y1=yi[dp]*RH+(a.ms?RH/2-2:15),x2=x-(r.ms?8:0),y2=y+(r.ms?RH/2-2:15);
      const cc=UI.crit&&a.crit&&r.crit?'#e06a7a':'#aebbcb';

  const tx=X(-p.st);

/* ============ clappia ============ */
async function clappia(appKey,data){
  const appId=CONN.apps[appKey];if(!CONN.key||!appId)return false;
  const d={};Object.entries(data).filter(e=>e[1]!==undefined).forEach(([k,v])=>d[k.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')]=String(v===''||v==null?'-':v));
  try{const r=await fetch('https://api-public-v4.clappia.com/submissions/create',{method:'POST',headers:{'x-api-key':CONN.key,'Content-Type':'application/json'},body:JSON.stringify({workplaceId:CONN.wp,appId,requestingUserEmailAddress:CONN.email,data:d})});
    if(!r.ok)throw 0;toast('Saved to Clappia');return true}catch(e){toast('Saved here. Clappia could not be reached.');return false}}

  if(t.id==='tq'){UI.q=t.value;$('#tbl').innerHTML=tbl(PG[UI.page])}
  if(t.id==='tp')$('#tpv').textContent=t.value+'%';
  if(t.id==='gs'){const q=t.value.toLowerCase().trim(),res=q?[...MODS.map(m=>({id:m.id,n:m.full,s:'System'})),...Object.values(PG).map(p=>({id:p.id,n:p.n,s:(MODS.find(m=>m.id===p.m)||{n:'Workspace'}).n}))].filter(x=>(x.n+' '+x.s).toLowerCase().includes(q)).slice(0,8):[];
    $('#gsr').innerHTML=res.length?`<div class="pop">${res.map(x=>`<button data-go="${x.id}"><b>${esc(x.n)}</b> <span class="sm mute">${esc(x.s)}</span></button>`).join('')}</div>`:q?'<div class="pop"><div class="pad mute sm">No matches</div></div>':''}});
document.addEventListener('change',e=>{if(e.target.dataset.ch==='proj'){UI.proj=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOv()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
  if(f.id==='cf'){const er={name:d.name.trim()?'':'Please enter your name',role:d.role.trim()?'':'Please enter your role',num:/^[+\d][\d\s\-()]{6,}$/.test(d.num.trim())?'':'Please enter a valid phone number',email:!d.email.trim()||/^\S+@\S+\.\S+$/.test(d.email.trim())?'':'Please check this email address'};
    Object.entries(er).forEach(([k,v])=>f.querySelector(`[data-e="${k}"]`).textContent=v);if(Object.values(er).some(Boolean))return;
    const lead={name:d.name.trim(),role:d.role.trim(),num:d.num.trim(),email:d.email.trim(),co:S.co||L.co||'',at:new Date().toLocaleString()};LEADS.unshift(lead);store.set('leads',LEADS);
    clappia('leads',{Name:lead.name,Role:lead.role,Number:lead.num,Email:lead.email,Company:lead.co});
    modal('Thank you',`<div class="mb" style="text-align:center;padding:30px 24px"><div style="width:54px;height:54px;border-radius:50%;background:var(--g-s);color:var(--g);display:grid;place-items:center;margin:0 auto;font-size:24px">✓</div><h2>Your request is with us, ${esc(lead.name.split(' ')[0])}</h2><p class="mute" style="margin:0">Our team will call you on ${esc(lead.num)} to take this forward.</p></div>`,`<button class="btn pri" data-act="close">Done</button>`);if(UI.page==='settings'&&S.role)render();return}
  if(f.id==='nf'){const p=PG[f.dataset.p],first=p.cols[0][0];if(!String(d[first]||'').trim()){$('#nfe').textContent='Please fill in '+first.toLowerCase()+'.';return}
    const r={id:p.pre+'-'+String(1041+DATA[p.id].length).padStart(4,'0')};p.cols.forEach(c=>{let v=d[c[0]];if(c[1]==='d'){const dt=new Date(v+'T00:00');v=isNaN(dt)?0:Math.round((dt-TODAY)/864e5)}else if(c[1]==='n')v=+v||0;r[c[0]]=v});
    DATA[p.id].unshift(r);(ADDED[S.ind+p.id]=ADDED[S.ind+p.id]||[]).unshift(r);store.set('added',ADDED);closeOv();notify(`${r.id} created`,p.n,p.id);toast('Record created');
    const out={...r};p.cols.forEach(c=>{if(c[1]==='d')out[c[0]]=dAt(r[c[0]]).toLocaleDateString('en-GB').replace(/\//g,'-')});clappia(p.m,{Workspace:p.n,'Record ID':r.id,...out,id:undefined,Industry:ind().n,Company:S.co});render();return}
  if(f.id==='tf2'){if(!d.n.trim()){$('#tfe').textContent='Please enter a task name.';return}const p=curP(),dt=new Date(d.s+'T00:00'),s=isNaN(dt)?3-p.st:Math.round((dt-TODAY)/864e5)-p.st,n=p.tasks.filter(t=>t.ph===+d.ph&&!t.ms).length+1;
    const t={id:d.ph+'.'+n+'a',n:d.n.trim(),d:Math.max(1,+d.d||1),deps:[],bs:s,s,ph:+d.ph,ms:false,owner:d.o,p:0,crit:false};const i=p.tasks.findIndex(x=>x.ph===+d.ph&&x.ms);p.tasks.splice(i<0?p.tasks.length:i,0,t);closeOv();toast('Task added to schedule');render();return}
  if(f.id==='clf'){const c=checklists().find(x=>x.id===f.dataset.c),res=c.items.map((q,i)=>({q,a:d['a'+i]||'',r:(d['r'+i]||'').trim()}));
    const miss=res.findIndex(x=>!x.a),nr=res.findIndex(x=>x.a==='Not OK'&&!x.r);
    if(miss>=0){$('#cle').textContent='Please answer checkpoint '+(miss+1)+'.';return}if(nr>=0){$('#cle').textContent='Please add a remark for checkpoint '+(nr+1)+' marked Not OK.';return}
    const R=role(),x=mkSub(c,R.n,R.t,d.unit,res,Date.now());x.shift=d.shift;SUBS.unshift(x);store.set('subs',SUBS);
    clappia(c.m,{Workspace:'Checklist',Checklist:c.n,'Record ID':x.id,Unit:x.unit,Shift:d.shift,'Submitted by':x.by,Role:x.role,'Compliance (%)':x.score,Issues:x.nok,Status:subSt(x),Details:res.map((r,i)=>(i+1)+'. '+r.q+': '+r.a+(r.r?' ('+r.r+')':'')).join(' | '),Industry:ind().n,Company:S.co});
    modal('Checklist submitted',`<div class="mb" style="text-align:center;padding:30px 24px"><div style="width:54px;height:54px;border-radius:50%;background:var(--g-s);color:var(--g);display:grid;place-items:center;margin:0 auto;font-size:24px">✓</div><h2>${esc(c.n)}</h2><p class="mute" style="margin:0">${x.score}% compliant, ${x.nok} issue${x.nok===1?'':'s'} flagged. Your supervisors can see this on their dashboard now. Switch to a manager role to view it.</p></div>`,`<button class="btn" data-act="logout">Switch role</button><button class="btn pri" data-act="close">Done</button>`);render();return}
  if(f.id==='mf2'){closeOv();toast('Message sent to '+d.to);return}
  if(f.id==='sendf'){const i=$('#chin'),v=i.value.trim();if(!v)return;const c=CHATS[UI.chat],k=UI.chat;c.ms.push({w:role().n,me:1,t:v,m:'Now'});render();$('#chin').focus();
    setTimeout(()=>{const who=c.g?PEOPLE.filter(x=>x!==role().n)[hash(v)%9]:k;c.ms.push({w:who,t:['Noted, I will update the record today.','Thanks. Sharing the details in the next ten minutes.','Agreed. Let us review it in the 10:30 meeting.','On it. I have assigned it to my team.','Good catch. I will raise it in the system right away.'][hash(v+c.ms.length)%5],m:'Now'});if(UI.page==='chat'&&UI.chat===k)render()},1300)}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(S.role&&h&&h!==UI.page&&(PG[h]||MODS.find(m=>m.id===h)||['home','inbox','chat','settings','checks'].includes(h)))go(h)});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.role&&UI.page==='pj-plan')render()},200)});

/* ============ boot ============ */
if(S.role&&S.co){build();const h=location.hash.slice(1);if(PG[h]||MODS.find(m=>m.id===h)||['inbox','chat','settings','checks'].includes(h)){UI.page=h;UI.open=PG[h]?.m||h}else UI.open=role().home==='home'?'projects':role().home;shell()}else vLogin();
</script>
</body></html>
